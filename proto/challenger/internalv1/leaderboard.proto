// Server-to-server read API that challenger-service exposes to
// challenger-notification-service. challenger-service owns this contract; the
// notification service mirrors the file byte-for-byte. A breaking change is a
// new v2 package, never an in-place edit (buf breaking guards this in CI).
syntax = "proto3";

package challenger.internal.v1;

option go_package = "github.com/Everfit-io/challenger-service/proto/challenger/internalv1;internalv1";

// LeaderboardInternalService serves leaderboard reads for the notification
// service. Every RPC requires the internal-api-secret metadata.
service LeaderboardInternalService {
  // ListParticipants pages every participant of a challenge in leaderboard
  // order, with the rank and points GET /leaderboards/{id} shows. An unknown
  // challenge, or one nobody has played, is an empty list with
  // total_participants = 0, not an error. UNAVAILABLE with reason
  // LEADERBOARD_REBUILDING while the leaderboard is being rebuilt; retry.
  rpc ListParticipants(ListParticipantsRequest) returns (ListParticipantsResponse);
}

// Participant is one ranked member of a challenge leaderboard.
message Participant {
  // 24-hex ObjectID of the auth-service account.
  string user_id = 1;
  // 1-based leaderboard position. Equal points rank by earlier submission, so
  // every participant has a distinct rank.
  int64 rank = 2;
  // Best score the participant submitted.
  int64 points = 3;
}

// ListParticipantsRequest pages a challenge's participants in rank order (the
// leaderboard order); page_token encodes the leaderboard cursor and is opaque
// to the caller.
message ListParticipantsRequest {
  // 24-hex ObjectID of the challenge.
  string challenge_id = 1;
  // 0 means 1000; larger values are capped at 1000; negative is rejected.
  int32 page_size = 2;
  // Opaque; empty starts from rank 1.
  string page_token = 3;
}

// ListParticipantsResponse is one page of participants.
message ListParticipantsResponse {
  repeated Participant participants = 1;
  // Empty when there are no more rows.
  string next_page_token = 2;
  // Participants in the whole leaderboard, not just this page (O(1)).
  int64 total_participants = 3;
}
